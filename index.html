<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rack Site Survey Editor</title>
<style>
/* Layout — sticky top bar (brand, document name, site tabs, undo/redo, export), then outline rail | form | paper preview.
   >=1180px three columns; 980-1179px section chips replace the rail; <980px one column with an edit/preview switch and a bottom bar.
   Look: engineering tool. Graphite neutrals, one teal accent, 1px hairlines, no gradients/glass/card shadows (popovers and modals only). */
:root{
  --bg:#F3F4F5; --surface:#FFFFFF; --surface-2:#F8F9FA; --hover:#EEF0F2; --fg:#1B1F23; --muted:#5C6870; --faint:#66707A; --line:#DADFE3; --line-strong:#C3CBD1; --field:#88939C;
  --accent:#1A5E80; --accent-fg:#FFFFFF; --accent-text:#1A5E80; --accent-soft:#E3EEF3;
  --danger:#B3261E; --danger-bg:#FCEDEC; --danger-fg:#FFFFFF; --warn:#8A5A00; --warn-bg:#FFF4D9; --ok:#1E7A4C;
  --toast-bg:#1B1F23; --toast-fg:#F3F4F5; --toast-link:#8FD0EC;
  --shadow-pop:0 6px 20px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.04);
  --paper:#FFFFFF; --ink:#1C1C1C; --doc-accent:#1A5E80; --doc-dev:#0E7C86; --doc-rule:#3A3A3A; --doc-grid:#E3E6E8;
  --ui:"Leelawadee UI","Segoe UI","Noto Sans Thai",Tahoma,sans-serif;
  --docf:"Leelawadee UI","Sarabun","Noto Sans Thai",Tahoma,sans-serif;
  --mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
  --r:5px; --bar-h:48px; --seg-h:0px; --chips-h:0px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101315; --surface:#171B1E; --surface-2:#1C2125; --hover:#232A2F; --fg:#E6EAED; --muted:#99A5AD; --faint:#8A969E; --line:#2A3137; --line-strong:#3A444C; --field:#66727B;
  --accent:#1A5E80; --accent-text:#7CC0E0; --accent-soft:#18303B;
  --danger:#F28B82; --danger-bg:#331C1B; --danger-fg:#1A0B0A; --warn:#EAB45A; --warn-bg:#33290F; --ok:#6BCB98;
  --toast-bg:#E6EAED; --toast-fg:#171B1E; --toast-link:#1A5E80;
  --shadow-pop:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101315; --surface:#171B1E; --surface-2:#1C2125; --hover:#232A2F; --fg:#E6EAED; --muted:#99A5AD; --faint:#8A969E; --line:#2A3137; --line-strong:#3A444C; --field:#66727B;
  --accent:#1A5E80; --accent-text:#7CC0E0; --accent-soft:#18303B;
  --danger:#F28B82; --danger-bg:#331C1B; --danger-fg:#1A0B0A; --warn:#EAB45A; --warn-bg:#33290F; --ok:#6BCB98;
  --toast-bg:#E6EAED; --toast-fg:#171B1E; --toast-link:#1A5E80;
  --shadow-pop:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--ui);font-variant-numeric:tabular-nums;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:13px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:12px;height:12px}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
small{font-size:12px;font-weight:400;color:var(--muted)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.brand .mark{width:20px;height:20px;border-radius:4px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand .mark .ic{width:13px;height:13px;stroke-width:1.8}
.sep-v{width:1px;height:20px;background:var(--line);flex:none}
.docname{font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.tabs{display:flex;align-items:stretch;align-self:stretch;min-width:0;margin-left:4px}
.tablist{display:flex;min-width:0;overflow-x:auto;scrollbar-width:thin}
.tabw{display:flex;align-items:center;flex:none;border-bottom:2px solid transparent;position:relative}
.tabw[data-sel="true"]{border-bottom-color:var(--accent-text)}
.tabw:hover{background:var(--hover)}
.tab{height:100%;min-height:46px;padding:0 6px 0 12px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{color:var(--fg);font-weight:600}
.tabx{display:grid;place-items:center;width:22px;height:22px;margin-right:6px;border:0;border-radius:4px;background:none;color:var(--muted);cursor:pointer;opacity:0;padding:0;font-size:12px;white-space:nowrap}
.tabw:hover .tabx,.tabw:focus-within .tabx,.tabw[data-sel="true"] .tabx{opacity:1}
.tabx:hover{color:var(--danger);background:var(--danger-bg)}
.tabx.arm{width:auto;padding:0 8px;opacity:1;background:var(--danger);color:var(--danger-fg);font-weight:600}
.tab-add{align-self:center;display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:var(--r);background:none;color:var(--muted);cursor:pointer;flex:none}
.tab-add:hover{background:var(--hover);color:var(--fg)}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.status.warn{color:var(--danger)}
.status.warn i{background:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--field);background:var(--surface);border-radius:var(--r);cursor:pointer;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.15);background:var(--accent)}
.btn.icon{width:28px;padding:0;color:var(--muted);border-color:transparent;background:transparent}
.btn.icon:hover{background:var(--hover);color:var(--fg)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.icon.sm{width:24px;padding:0}
.btn.del{color:var(--muted)}
.btn.del:hover{color:var(--danger);background:var(--danger-bg)}
.btn.arm,.btn.arm:hover{background:var(--danger);border-color:var(--danger);color:var(--danger-fg);font-weight:600}
.ib{position:relative}
.ib.arm::after{content:attr(data-arm);position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);background:var(--danger);color:var(--danger-fg);font-size:12px;font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:var(--r);z-index:6;pointer-events:none}
.filebtn{position:relative;cursor:pointer}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px;inset:0}
.filebtn:focus-within{outline:2px solid var(--accent-text);outline-offset:1px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:34px;width:290px;max-width:calc(100vw - 16px);padding:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow-pop);z-index:40}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 8px;border:0;background:none;border-radius:4px;cursor:pointer;text-align:left;font-size:13px;white-space:nowrap}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu button:focus-visible{outline-offset:-2px}
.menu button .k{margin-left:auto;color:var(--muted);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .danger,.menu .danger .k{color:var(--danger)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 16px 0;padding:10px 14px;background:var(--surface);border:1px solid var(--danger);border-left-width:5px;border-radius:var(--r);color:var(--fg);font-size:13px}
.banner b{color:var(--danger)}

/* ---------- mobile switch, chips, bottom bar ---------- */
.seg{display:none;position:sticky;top:var(--bar-h);z-index:25;grid-template-columns:1fr 1fr;padding:8px 12px;background:var(--bg)}
.seg-in{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--field);border-radius:var(--r);overflow:hidden;background:var(--surface);grid-column:1/-1}
.seg button{height:34px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px}
.seg button+button{border-left:1px solid var(--field)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.chips{display:none;position:sticky;top:calc(var(--bar-h) + var(--seg-h));z-index:20;gap:6px;padding:8px 16px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--field);border-radius:15px;background:var(--surface);font-size:13px;white-space:nowrap;color:var(--fg);text-decoration:none;flex:none}
.chip[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-text);font-weight:600}
.mbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:35;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.mbar .btn{flex:1;height:40px}
.mbar .btn.icon{flex:none;width:40px;border-color:var(--field);color:var(--fg)}
.mbar .btn.primary{flex:2}

/* ---------- workbench ---------- */
.work{display:grid;grid-template-columns:220px minmax(420px,600px) minmax(0,1fr);align-items:start}
.rail{position:sticky;top:var(--bar-h);height:calc(100vh - var(--bar-h));height:calc(100dvh - var(--bar-h));overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:12px 8px}
.rail h6{margin:0 8px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.rail h6 span{text-transform:none;letter-spacing:0;font-weight:400}
.rail .site{margin:0 8px 10px;font-size:12px;color:var(--muted)}
.rail .site b{display:block;color:var(--fg);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{list-style:none;margin:0;padding:0}
.nav a{display:flex;align-items:center;gap:8px;min-height:30px;padding:3px 8px;border-radius:var(--r);color:var(--fg);text-decoration:none;font-size:13px}
.nav a:hover{background:var(--hover)}
.nav a[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav .tx{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.nav .tx small{font-size:11px;color:var(--muted)}
.nav a[aria-current="true"] .tx small{color:var(--accent-text)}
.nav .n{width:14px;color:var(--faint);font:12px var(--mono);text-align:right;display:grid;place-items:center;flex:none}
.nav .sub{padding-left:22px;margin:2px 0 4px}
.nav .sub a{font-size:13px}
.nav .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nav .add{color:var(--accent-text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto;border:1.5px solid var(--faint)}
.dot.full{background:var(--ok);border-color:var(--ok)}
.dot.part{border-color:var(--warn);background:var(--warn);box-shadow:inset 0 0 0 1.5px var(--surface)}
.badge{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600;background:var(--warn-bg);color:var(--warn);margin-left:auto;flex:none}
.badge.err{background:var(--danger-bg);color:var(--danger)}
.legend{margin:14px 8px 0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:4px}
.legend>span{display:flex;align-items:center;gap:8px}
.legend .dot{margin:0}

.editor-col{min-width:0;border-right:1px solid var(--line)}
.editor{padding:12px 16px calc(100vh - var(--bar-h) - 200px);display:flex;flex-direction:column;gap:8px;min-width:0}
.form-tools{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-size:12px;color:var(--muted)}
.form-tools b{color:var(--fg);font-weight:600}
.form-tools .sp{flex:1}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:6px;scroll-margin-top:calc(var(--bar-h) + var(--seg-h) + var(--chips-h) + 8px)}
.sec[open]{border-color:var(--line-strong)}
.sec>summary,.rack>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:38px;border-radius:6px}
.sec>summary::-webkit-details-marker,.rack>summary::-webkit-details-marker{display:none}
.sec>summary:hover,.rack>summary:hover{background:var(--hover)}
.chev{color:var(--muted);transition:transform .1s}
details[open]>summary>.chev{transform:rotate(90deg)}
.sec>summary .t{font-weight:600;min-width:0;white-space:nowrap}
.sec>summary .t small{margin-left:6px}
.sec>summary .num{font-family:var(--mono);font-size:12px;color:var(--faint);margin-right:6px;font-weight:400}
.sec>summary .sum{margin-left:auto;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sec>summary .dot{margin-left:0}
.err-t{color:var(--danger);font-weight:600}
.sec-b{border-top:1px solid var(--line);padding:12px;display:grid;gap:14px;background:var(--surface-2);border-radius:0 0 6px 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 12px}
.row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 96px;gap:10px}
.fld{display:grid;gap:4px;min-width:0;align-content:start}
.fld>.lbl,label.fld>.lbl{font-size:12.5px;font-weight:600}
.lbl small{margin-left:6px}
input[type=text],input[type=number],input:not([type]),textarea,select{width:100%;height:30px;padding:3px 8px;border:1px solid var(--field);border-radius:var(--r);background:var(--surface);min-width:0}
textarea{height:auto;min-height:74px;resize:vertical;line-height:1.55;padding:6px 8px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:hover,textarea:hover,select:hover{border-color:var(--faint)}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent-text);outline-offset:-1px;border-color:var(--accent-text)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.hint,.note{font-size:12px;color:var(--muted);margin:0}
.note code{font-family:var(--mono)}
.chip-s{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts .sp{flex:1}

.rack{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);scroll-margin-top:calc(var(--bar-h) + var(--seg-h) + var(--chips-h) + 8px)}
.rack[open]{border-color:var(--accent-text)}
.rack>summary{padding:5px 10px;min-height:40px;flex-wrap:wrap;row-gap:0}
.rk-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.rk-sum .name{font-weight:600}
.sumline{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sumline .d{color:var(--faint)}
.rack>summary .dot{margin-left:auto}
.rack-b{border-top:1px solid var(--line);padding:12px;display:grid;gap:14px}
.foot-actions{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.foot-actions .sp{flex:1}

.tblwrap{border:1px solid var(--field);border-radius:var(--r);overflow:hidden}
table.grid{width:100%;border-collapse:separate;border-spacing:0}
.grid th{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--field)}
.grid th small{margin-left:4px}
.grid td{padding:0;border-bottom:1px solid var(--line);vertical-align:top;background:var(--surface)}
.grid td+td,.grid th+th{border-left:1px solid var(--line)}
.grid td input{border:0;border-radius:0;height:32px;background:transparent}
.grid td input:focus-visible{outline-offset:-2px}
.grid .u,.grid .h{width:84px}
.grid .a{width:60px}
.grid td.act{text-align:center;vertical-align:middle}
.grid td.act .btn{margin:3px 0}
.grid tr.err td{background:var(--danger-bg)}
.grid tr.err td input[aria-invalid="true"]{box-shadow:inset 0 0 0 1px var(--danger)}
.grid tr.errmsg td{padding:3px 8px 5px;font-size:12px;color:var(--danger);background:var(--danger-bg);border-left:0}
.grid tr.errmsg[hidden]{display:none}
.grid tr:last-child td{border-bottom:0}
.grid tr.errmsg .ic{vertical-align:-2px;margin-right:6px}
.addrow{display:flex;align-items:center;gap:6px;width:100%;height:32px;padding:0 8px;background:var(--surface-2);border:0;border-top:1px solid var(--line);color:var(--accent-text);cursor:pointer;font-size:13px;font-weight:600}
.addrow:hover{background:var(--hover)}
.addrow:focus-visible{outline-offset:-2px}
.plist{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:22px minmax(0,1fr) 28px;gap:6px;align-items:center}
.prow .i{font:12px var(--mono);color:var(--muted);text-align:right}
.cable{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:10px;display:grid;gap:8px}
.cable-h{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:8px;align-items:center}

.floor-opts{display:flex;gap:14px;flex-wrap:wrap}
.inl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.inl select{width:auto;min-width:150px}
.inl small{margin-left:6px}
.floor-edit{display:grid;gap:12px;justify-items:start}
.floor-edit .svgbox{background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r);padding:8px;overflow:auto;max-width:100%}
.svgbox g[role="button"]{cursor:pointer;outline:none}
.svgbox g[role="button"]:focus-visible>rect{stroke:#1A5E80;stroke-width:3}
.floor-items{width:100%;min-width:0;display:flex;flex-direction:column;gap:8px}
.fi{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:6px;align-items:center}
.fi .mv{display:flex;align-items:center}
.flegend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.flegend span{display:inline-flex;align-items:center;gap:6px}
kbd{display:inline-block;border:1px solid var(--field);border-bottom-width:2px;border-radius:3px;padding:0 4px;font:11px var(--mono);color:var(--muted)}
.imgdrop{border:1.5px dashed var(--field);border-radius:var(--r);padding:14px;text-align:center;color:var(--muted);font-size:13px;display:grid;gap:8px;justify-items:center;background:var(--surface)}
.imgdrop img{max-height:180px;max-width:100%;display:block;border-radius:4px}

/* ---------- preview pane ---------- */
.preview-wrap{position:sticky;top:var(--bar-h);height:calc(100vh - var(--bar-h));height:calc(100dvh - var(--bar-h));display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.prev-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);min-height:36px}
.prev-bar b{font-weight:600;color:var(--fg);font-size:13px}
.prev-bar .follow{color:var(--faint)}
.prev-bar #pvMeta{margin-left:auto;font-family:var(--mono)}
.prev-scroll{flex:1;overflow:auto;padding:20px}

/* ---------- modal, toast ---------- */
.modal{position:fixed;inset:0;background:rgba(5,15,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow-pop);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column}
.modal-card header{padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.modal-card header h3{margin:0;font-size:15px;flex:1}
.modal-card .mb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-card textarea{width:100%;min-height:320px;font:12px/1.5 var(--mono);background:var(--surface-2);color:var(--fg)}
.modal-card p{margin:0}
.toast-host{position:fixed;left:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100vw - 24px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--toast-bg);color:var(--toast-fg);border-radius:var(--r);padding:8px 8px 8px 14px;box-shadow:var(--shadow-pop);font-size:13px}
.toast .t-ic{opacity:.8}
.toast .sepd{opacity:.5}
.tbtn{border:0;background:none;color:var(--toast-link);font-weight:600;cursor:pointer;padding:2px 8px;border-radius:4px;font-size:13px;min-height:24px}
.tbtn:hover{text-decoration:underline}
.tbtn.close{color:inherit;opacity:.7;padding:4px;display:grid;place-items:center}
.toast :focus-visible{outline-color:currentColor}

/* ---------- breakpoints ---------- */
@media (max-width:1279px){.brand-t,.sep-v.hide-s{display:none}.docname{max-width:140px}}
@media (max-width:1179px){
  .work{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rail{display:none}
  .chips{display:flex}
  .bar .status span{display:none}
}
@media (max-width:979px){
  .bar{flex-wrap:wrap;gap:0 8px;padding:0 8px}
  .bar .tabs{order:10;flex:1 0 100%;margin:0 -8px;padding:0 8px;border-top:1px solid var(--line);height:42px;align-self:auto}
  .bar .spacer{flex:1}
  .bar #bDocx,.bar .sep-v,.bar #bUndo,.bar #bRedo{display:none}
  .bar .status span{display:inline;font-size:11px}
  .bar .btn.icon{width:40px;height:40px}
  .bar #bExport{width:40px;padding:0}
  .bar #bExport .lbl{display:none}
  .docname{max-width:none;flex:0 1 auto;min-width:0}
  .bar .brand{order:0}
  .seg{display:grid}
  .seg button{height:40px}
  .work{grid-template-columns:minmax(0,1fr)}
  .editor-col{border-right:0}
  .editor{padding-bottom:96px}
  .preview-wrap{position:static;height:auto}
  .prev-scroll{overflow:visible;padding:12px 12px 96px}
  body[data-mv="edit"] .preview-wrap{display:none}
  body[data-mv="preview"] .editor-col{display:none}
  body[data-mv="preview"] .chips{display:none}
  .mbar{display:flex}
  .toast-host{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .btn,.chip,.tab,.tab-add{min-height:40px}
  .btn.icon.sm{width:40px;height:40px}
  .btn.sm{height:36px}
  .chip{height:40px}
  .tab-add{width:40px;height:40px}
  .tabx{width:34px;height:34px;opacity:0}
  .tabw[data-sel="true"] .tabx{opacity:1}
  .tabw:hover .tabx{opacity:0}
  .tabw[data-sel="true"]:hover .tabx{opacity:1}
  input[type=text],input[type=number],input:not([type]),select{height:40px}
  .grid td input{height:40px}
  .grid td.act .btn{margin:0}
  .prow{grid-template-columns:22px minmax(0,1fr) 40px}
  .cable-h{grid-template-columns:minmax(0,1fr) 40px}
  .sec>summary,.rack>summary{min-height:44px}
  .grid .u,.grid .h{width:64px}
  .grid .a{width:44px}
  .menu button{height:44px}
  .sec>summary .sum{display:none}
  .sec>summary .dot{margin-left:auto}
  .sec>summary .t small{display:block;margin:0;line-height:1.2}
}
@media (max-width:520px){
  .row3{grid-template-columns:minmax(0,1fr) 96px}
  .row3>:first-child{grid-column:1/-1}
  .fi{grid-template-columns:minmax(0,1fr) auto}
  .fi>select{grid-column:1/-1}
  .editor{padding-left:12px;padding-right:12px}
  .sec-b,.rack-b{padding:10px}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
/* ---------- paper document (always print-white, like the Word file) ---------- */
.doc{display:flex;flex-direction:column;gap:16px;align-items:center}
.page{background:var(--paper);color:var(--ink);width:100%;max-width:640px;aspect-ratio:auto;min-height:420px;padding:28px 34px 34px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 20px rgba(0,0,0,.06);font:12.5px/1.55 var(--docf);position:relative}
@media (max-width:520px){.page{padding:20px 16px}}
.page .logo{display:flex;justify-content:flex-end;min-height:30px;margin-bottom:14px}
.page .logo img{height:30px;width:auto}
.page .logo .lt{font:700 18px/1 var(--docf);color:var(--doc-accent);letter-spacing:.04em}
.cover{display:flex;flex-direction:column;justify-content:center;min-height:520px}
.cover .logo{position:absolute;top:28px;right:34px;margin:0}
.cover hr{border:none;border-top:2px solid var(--doc-accent);margin:0}
.cover h1{font:400 34px/1.15 var(--docf);color:var(--doc-accent);margin:22px 0}
.cover .co{font-size:14px;margin:16px 0 22px;color:#333}
.cover .sc{font-size:11px;color:#555}
.toc h4{text-align:center;margin:0 0 14px;font-size:13px}
.toc>div.e{display:flex;gap:6px;font-size:12px;padding:3px 0}
.toc>div.s{padding-left:14px;font-weight:600}
.toc>div.e::after{content:"";flex:1;border-bottom:1px dotted #999;margin-bottom:5px;order:2}
.toc>div.e span:last-child{order:3}
.page h2{font:400 17px/1.3 var(--docf);color:var(--doc-accent);margin:0 0 12px}
.page h5{font:700 13px/1.4 var(--docf);margin:14px 0 8px}
table.t{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
table.t td{border:1px solid var(--doc-rule);padding:3px 7px;vertical-align:top}
table.t td.k{width:36%}
table.t td.hd{font-weight:700}
table.t td.fig{text-align:center;padding:12px}
table.t td .ln{display:block}
.fig svg{max-width:100%;height:auto}
.diagram img{max-width:100%;margin:0 auto;display:block}
.diagram .ph{border:1px dashed #aaa;color:#888;padding:40px;text-align:center}
.cap{font-size:11px;color:#444;text-align:center;margin-top:6px;white-space:pre-wrap}
@page{size:A4;margin:0}
@media print{
  :root{--bg:#fff}
  body{background:#fff}
  .bar,.seg,.mbar,.rail,.chips,.editor-col,.prev-bar,#modalRoot,.toast-host,.banner,#armLive,.sprite{display:none!important}
  .work{display:block!important;padding:0}
  .preview-wrap{display:block!important;position:static;height:auto;border:none;background:#fff;padding:0}
  .prev-scroll{overflow:visible;padding:0}
  .doc{display:block}
  .page{box-shadow:none;max-width:none;width:210mm;min-height:297mm;padding:18mm 20mm;page-break-after:always;break-after:page;font-size:11pt}
  .page:last-child{page-break-after:auto;break-after:auto}
  .cover{min-height:297mm}
  table.t tr{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function blankRack(){return {id:uid(),device:'',rack:'Rack ',size:42,devices:[{id:uid(),name:'',u:21,h:1}],power:['มีเพียงพอต่อการใช้งาน C12-C13','มีเพียงพอต่อการใช้งาน C12-C13'],

/* ---------- schema version + migration ----------
   v1 = original shape (no "v"). v2 = same shape + "v" stamp, all fields normalised.
   To add fields later: bump SCHEMA and add a step `if(v<3){...defaults...;v=3}` in migrate(). */
const SCHEMA=2;
const isO=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const str=(x,d='')=>typeof x==='string'?x:typeof x==='number'?String(x):d;
const arr=x=>Array.isArray(x)?x:[];
function migrate(o){
  if(!isO(o)||!Array.isArray(o.sites))return null;
  let v=+o.v||1;
  if(v<2){v=2} // v1 → v2: no shape change; normalisation below fills any missing fields
  // Phase-1 example: if(v<3){o.sites.forEach(s=>{if(isO(s)){s.photos=arr(s.photos);s.issues=arr(s.issues);s.signoff=isO(s.signoff)?s.signoff:{}}});v=3}
  const d=isO(o.doc)?o.doc:{};
  o.doc={...d,title:str(d.title,'Site Survey'),company:str(d.company),logoText:str(d.logoText,'APJC'),logo:d.logo==null?null:str(d.logo)};
  o.sites=o.sites.filter(isO).map(normSite);
  o.cur=Number.isInteger(+o.cur)&&+o.cur>=0&&+o.cur<o.sites.length?+o.cur:0;
  o.v=SCHEMA;
  return o;
}
function normSite(s){
  const fill=(x,ks)=>{x=isO(x)?x:{};ks.forEach(k=>x[k]=str(x[k]));return x};
  s.id=str(s.id)||uid();s.name=str(s.name);
  s.info=fill(s.info,['agency','location','datetime','surveyors']);
  s.place=fill(s.place,['equipment','building','address','racks']);
  const f=s.floor=isO(s.floor)?s.floor:{};
  f.orient=f.orient==='v'?'v':'h';f.door=['left','center','right','none'].includes(f.door)?f.door:'center';
  f.items=arr(f.items).filter(isO).map(it=>it.type==='row'
    ?{...it,id:str(it.id)||uid(),type:'row',racks:arr(it.racks).map(r=>isO(r)?{...r,n:str(r.n),on:!!r.on}:{n:str(r),on:false})}
    :{...it,id:str(it.id)||uid(),type:'label',text:str(it.text)});
  s.racks=arr(s.racks).filter(isO).map(r=>{r.id=str(r.id)||uid();r.device=str(r.device);r.rack=str(r.rack);if(!(+r.size>0))r.size=42;
    r.devices=arr(r.devices).filter(isO).map(d=>({...d,id:str(d.id)||uid(),name:str(d.name),u:d.u??'',h:d.h??1}));
    r.power=arr(r.power).map(p=>str(p));
    r.cables=arr(r.cables).filter(isO).map(c=>({...c,id:str(c.id)||uid(),type:str(c.type),text:str(c.text)}));return r});
  const g=isO(s.diagram)?s.diagram:{};
  s.diagram={...g,img:typeof g.img==='string'&&g.img?g.img:null,caption:str(g.caption)};
  return s;
}

/* ---------- image store: data URLs live in IndexedDB, S keeps "idb:<id>" refs ----------
   IMG is the in-memory cache (id → data URL) so rendering stays synchronous.
   If IndexedDB is unavailable, putImg() returns the data URL itself and S stays inline (old behaviour). */
const IDB_RE=/^idb:[a-z0-9]+$/,DATA_RE=/^data:image\/[\w.+-]+;base64,/,IMG={},GC_AGE=864e5;
let idbP;
function idbOpen(){  // resolves the db, or null if unavailable; a slow open only times out this call, later calls still get the db
  idbP=idbP||new Promise(res=>{try{const r=indexedDB.open(KEY+'-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');
    r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
  return Promise.race([idbP,new Promise(r=>setTimeout(()=>r(null),5000))])}
function idb(mode,fn){return idbOpen().then(db=>db&&new Promise(res=>{
  try{const tx=db.transaction('img',mode),q=fn(tx.objectStore('img'));tx.oncomplete=()=>res(q?q.result:true);tx.onerror=tx.onabort=()=>res(null)}catch(e){res(null)}}))}
function imgURL(ref){return typeof ref==='string'&&IDB_RE.test(ref)?(IMG[ref.slice(4)]||''):(ref||'')}
const diagImg=s=>imgURL(s.diagram.img);
function hashStr(u){let a=0x811c9dc5,b=0x01000193^u.length;for(let i=0;i<u.length;i++){const c=u.charCodeAt(i);a=Math.imul(a^c,16777619);b=Math.imul(b+c,2246822519)^(b>>>13)}
  return (a>>>0).toString(36)+(b>>>0).toString(36)}
async function putImg(u){
  if(!DATA_RE.test(u))return u;
  let id=hashStr(u);const old=await idb('readonly',st=>st.get(id));
  if(old===null)return u;                         // no IndexedDB → keep inline
  if(old&&old.u!==u)id+=uid();                     // hash collision → distinct id
  if(!await idb('readwrite',st=>st.put({u,t:Date.now()},id)))return u;
  IMG[id]=u;return 'idb:'+id;
}
function walkStr(o,fn){for(const k in o){const v=o[k];if(typeof v==='string'){const r=fn(v);if(r!==undefined)o[k]=r}else if(v&&typeof v==='object')walkStr(v,fn)}}
const refIds=t=>[...String(t).matchAll(/"idb:([a-z0-9]+)"/g)].map(m=>m[1]);
async function internImages(o){const todo=[];walkStr(o,v=>{if(DATA_RE.test(v))todo.push(v)});   // inline data URLs → IDB refs
  const map={};for(const u of todo)if(!(u in map))map[u]=await putImg(u);walkStr(o,v=>v in map?map[v]:undefined);return o}
async function loadImages(o){const ids=refIds(JSON.stringify(o)).filter(id=>!(id in IMG));
  for(const id of ids){const r=await idb('readonly',st=>st.get(id));if(r&&r.u)IMG[id]=r.u}return ids.length}
function inlineImages(o){const c=JSON.parse(JSON.stringify(o));walkStr(c,v=>IDB_RE.test(v)?(IMG[v.slice(4)]||''):undefined);return c}
async function gcImages(){  // drop records no longer referenced by S, saved storage or undo/redo history (and older than a day, so other tabs are safe)
  let raw='';try{raw=localStorage.getItem(KEY)||''}catch(e){}
  const keep=new Set(refIds(JSON.stringify(S)+raw+UNDO.join('')+REDO.join('')));
  const keys=await idb('readonly',st=>st.getAllKeys());if(!keys)return;
  for(const k of keys){if(keep.has(k))continue;const r=await idb('readonly',st=>st.get(k));if(!r||Date.now()-(r.t||0)>GC_AGE){await idb('readwrite',st=>st.delete(k));delete IMG[k]}}
}
const exportJSON=()=>JSON.stringify(inlineImages(S),null,1);

/* ---------- undo / redo: JSON snapshots of S ----------
   mutate(fn) snapshots before fn and records it if S changed. Typing is coalesced: beginEdit() keeps the
   pre-edit snapshot until ~1 s idle or blur (commitEdit). Images are refs, so snapshots stay small. */
const UNDO=[],REDO=[],UMAX=50;let editSnap=null,editT;
const snap=()=>JSON.stringify(S);
function pushUndo(b){UNDO.push(b);if(UNDO.length>UMAX)UNDO.shift();REDO.length=0;histUI()}
function commitEdit(){clearTimeout(editT);if(editSnap!==null&&editSnap!==snap())pushUndo(editSnap);editSnap=null}
function beginEdit(){if(editSnap===null)editSnap=snap();clearTimeout(editT);editT=setTimeout(commitEdit,1000)}
function mutate(fn){commitEdit();const b=snap();const r=fn();if(snap()!==b)pushUndo(b);return r}
function restore(json){S=migrate(JSON.parse(json));save();renderAll();loadImages(S).then(n=>{if(n)renderAll()});histUI()}
function undo(){commitEdit();if(!UNDO.length)return false;REDO.push(snap());restore(UNDO.pop());return true}
function redo(){commitEdit();if(!REDO.length)return false;UNDO.push(snap());if(UNDO.length>UMAX)UNDO.shift();restore(REDO.pop());return true}
function histUI(){[['bUndo','mUndo',UNDO],['bRedo','mRedo',REDO]].forEach(([a,b,st])=>[a,b].forEach(i=>{const e=document.getElementById(i);if(e)e.disabled=!st.length}))}

/* ---------- path helpers for bound inputs ---------- */
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,p,v){const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}

/* ---------- derived ---------- */
function unitsOf(r){return r.devices.reduce((a,d)=>a+(+d.h||0),0)}
function uLabel(r){return r.devices.filter(d=>d.u).map(d=>(+d.h>1)?`U ${d.u}–${+d.u+ +d.h-1}`:`U ${d.u}`).join(', ')}
/* devErrors(r): {deviceIndex: message} for devices outside 1–size U or overlapping an earlier device (shown inline under the row). */
function devErrors(r){const e={},occ={};
  r.devices.forEach((d,i)=>{const u=+d.u,h=+d.h||1;if(!u)return;
    if(u<1||u+h-1>r.size)e[i]=`เกินขนาดตู้ — ใช้ได้เฉพาะ U 1–${r.size}`;
    for(let k=u;k<u+h;k++){
      if(occ[k]!==undefined){if(!e[i])e[i]=`ทับซ้อนกับ ${r.devices[occ[k]].name||'อุปกรณ์อื่น'} ที่ U ${k} — เลื่อนตำแหน่งหรือลดความสูง`}
      else occ[k]=i}});
  return e}
/* Completeness for the outline dots: 'full' | 'part' | 'empty'. Simple "required fields filled" rules (UI only, no effect on output). */
const filled=v=>String(v??'').trim()!=='';
const lvl=(n,total)=>n<=0?'empty':n>=total?'full':'part';
function rackStat(r){
  const n=[filled(r.device),filled(r.rack)&&r.rack.trim()!=='Rack',r.devices.some(d=>filled(d.name)&&+d.u>0),r.power.some(filled),r.cables.some(c=>filled(c.text))].filter(Boolean).length;
  const st=lvl(n,5);return st==='full'&&Object.keys(devErrors(r)).length?'part':st}

/* ---------- SVG drawings ---------- */
function rackSVG(r){
  const UH=8,top=10,lx=26,w=220,H=r.size*UH;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${lx+w+14} ${H+top*2}" width="${lx+w+14}" height="${H+top*2}" font-family="Leelawadee UI,Sarabun,Tahoma,sans-serif">`;
  s+=`<rect x="${lx-18}" y="${top-4}" width="${w+26}" height="${H+8}" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.5"/>`;
  s+=`<rect x="${lx}" y="${top}" width="${w}" height="${H}" fill="#FAFBFC" stroke="#9AA3A8" stroke-width=".6"/>`;
  for(let u=1;u<=r.size;u++){const y=top+H-u*UH;
    s+=`<line x1="${lx}" x2="${lx+w}" y1="${y}" y2="${y}" stroke="#E3E6E8" stroke-width=".5"/>`;
    s+=`<text x="${lx-4}" y="${y+UH-2}" font-size="5.5" text-anchor="end" fill="#777" font-family="Consolas,monospace">${u}</text>`}
  r.devices.forEach(d=>{const u=+d.u,h=+d.h||1;if(!u||u<1)return;const y=top+H-(u+h-1)*UH;
    s+=`<rect x="${lx+1.5}" y="${y+.6}" width="${w-3}" height="${h*UH-1.2}" fill="#0E7C86"/>`;
    s+=`<text x="${lx+w/2}" y="${y+h*UH/2+2.4}" font-size="${h>1?8:6.5}" font-weight="700" fill="#FFFFFF" text-anchor="middle">${esc(d.name)}</text>`});
  return s+`</svg>`;
}
function floorSVG(f,interactive){
  const vert=f.orient==='v', CW=vert?36:72, CH=vert?28:90, LBL=30, pad=18;
  // Lay out items along the main axis (top→bottom for horizontal rows, left→right for vertical columns)
  let pos=pad, cross=0; const placed=[];
  f.items.forEach((it,i)=>{if(it.type==='row'){const len=it.racks.length*(vert?CH:CW);cross=Math.max(cross,len);placed.push({it,i,at:pos,size:vert?CW:CH});pos+=vert?CW:CH}
    else{placed.push({it,i,at:pos,size:LBL});pos+=LBL}});
  const crossTot=Math.max(cross,vert?120:160)+pad*2+ (vert?24:0);
  const main=pos+pad+(vert?24:24);
  const W=vert?main:crossTot, H=vert?crossTot+10:main+10;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Leelawadee UI,Sarabun,Tahoma,sans-serif">`;
  s+=`<rect x="1" y="1" width="${W-2}" height="${H-12}" fill="#FFFFFF" stroke="#1A5E80" stroke-width="1.2"/>`;
  const c0=(crossTot-cross)/2;
  placed.forEach(p=>{
    if(p.it.type==='label'){
      if(vert){const x=p.at+LBL/2,y=(H-10)/2;s+=`<text x="${x}" y="${y}" font-size="11" fill="#1C1C1C" text-anchor="middle" transform="rotate(-90 ${x} ${y})">${esc(p.it.text)}</text>`}
      else s+=`<text x="${W/2}" y="${p.at+LBL/2+4}" font-size="11" fill="#1C1C1C" text-anchor="middle">${esc(p.it.text)}</text>`;
    }else{
      const n=p.it.racks.length,len=n*(vert?CH:CW),start=(crossTot-len)/2;
      p.it.racks.forEach((rk,j)=>{
        const x=vert?p.at:start+j*CW, y=vert?start+j*CH:p.at, w=vert?CW:CW, h=vert?CH:CH;
        const fill=rk.on?'#16607F':'#FFFFFF', tc=interactive&&rk.on?'#FFFFFF':'#1C1C1C', btn=interactive&&rk.n;
        s+=`<g ${interactive?`data-tog="${p.i}:${j}" style="cursor:pointer"${btn?` role="button" tabindex="0" aria-pressed="${!!rk.on}" aria-label="ตู้ ${esc(rk.n)} ${rk.on?'ติดตั้ง':'ไม่ติดตั้ง'}"`:''}`:''}><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#555" stroke-width=".8"/>`;
        if(rk.n)s+=`<text x="${x+w/2}" y="${vert?y+h/2+4:y+h-8}" font-size="${vert?9:10}" fill="${tc}" text-anchor="middle" pointer-events="none">${esc(rk.n)}</text>`;
        if(btn&&rk.on)s+=`<path d="M${x+w-14} ${y+8} l3.5 3.5 l7 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`;  // install state is not colour-only (editor only)
        s+=`</g>`});
    }});
  // door
  if(f.door!=='none'){const dw=60,dx=f.door==='left'?W*0.18:f.door==='right'?W*0.82:W/2,yb=H-11;
    s+=`<path d="M${dx-dw/2} ${yb+6} L${dx-dw/2+8} ${yb-7} L${dx+dw/2-8} ${yb-7} L${dx+dw/2} ${yb+6} Z" fill="#1A5E80"/><text x="${dx}" y="${yb+3}" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Door</text>`}
  return s+`</svg>`;
}

/* ---------- section registry: one entry per numbered section of a site ----------
   Section number = position + 1. x = {n, t (title), id (preview anchor)}; c = DOCX helpers from buildDocx().

    ${F('วัน-เวลาที่สำรวจ',P+'.info.datetime',{en:'Date & time',ph:'วันพุธที่ 8 กรกฏาคม 2569 เวลา 11:00 – 12:00 น.'})}${F('ผู้เข้าสำรวจพื้นที่',P+'.info.surveyors',{en:'Surveyors',area:1,ph:'ชื่อผู้สำรวจ 1 คนต่อ 1 บรรทัด'})}
  </div>`,
  doc:(s,si,x)=>`<h5 id="${x.id}">${x.n}.&nbsp; ${x.t}</h5>
    <table class="t">${kv('ชื่อหน่วยงาน',s.info.agency)}${kv('สถานที่/ที่อยู่',s.info.location)}${kv('วัน-เวลาที่สำรวจ',s.info.datetime)}<tr><td class="k" style="height:38px">ผู้เข้าสำรวจพื้นที่</td><td>${esc(s.info.surveyors).replace(/\n/g,'<br>')}</td></tr></table>

const secX=(sec,k,si)=>({n:k+1,t:sec.title,id:`pv-${si}-${sec.id}`});
/* Page plan shared by the preview TOC and the DOCX TOC: cover=1, TOC=2, then per site. */
function pagePlan(){let pg=3;
  const sites=S.sites.map(s=>{const start=pg;let cur=pg,open=true;
    const secs=SECTIONS.map(sec=>{if(sec.page){const p=cur+1;cur+=sec.pages(s);open=false;return p}if(!open){cur++;open=true}return cur});
    pg=cur+1;return {s,start,secs}});
  return {sites,pages:pg-1}}

/* ---------- chrome: site tabs, outline rail, section chips, cards ---------- */
const DOT_T={full:'ครบ',part:'บางส่วน',empty:'ว่าง'};
const dotI=(st,extra='')=>`<i class="dot ${st}" role="img" aria-label="${DOT_T[st]}" title="${DOT_T[st]}"${extra}></i>`;
let ACTIVE='doc';   // nav key of the card being read/edited: 'doc' | 'site' | 'sec:<id>' | 'rack:<index>'
const edId=k=>k==='doc'?'ed-doc':k==='site'?`ed-${S.cur}-site`:k.startsWith('sec:')?`ed-${S.cur}-${k.slice(4)}`:`ed-${S.cur}-racks-rack-${k.slice(5)}`;
const pvId=k=>k==='doc'?'pv-cover':k==='site'?`pv-${S.cur}`:k.startsWith('sec:')?`pv-${S.cur}-${k.slice(4)}`:`pv-${S.cur}-racks-rack-${k.slice(5)}`;

function renderTabs(){
  const n=S.sites.length;
  document.getElementById('tabs').innerHTML=`<div class="tablist" role="tablist" aria-label="ไซต์ Sites">${S.sites.map((s,i)=>{const sel=i===S.cur,nm=s.name||'ไซต์ไม่มีชื่อ';
    return `<div class="tabw" role="presentation" data-sel="${sel}"><button class="tab" type="button" role="tab" id="tab-${i}" aria-selected="${sel}" aria-controls="editor" tabindex="${sel?0:-1}" data-tab="${i}" title="${esc(nm)}">${esc(nm)}</button>${n>1?`<button class="tabx" type="button" data-tabx="${i}"${sel?'':' tabindex="-1"'} title="ลบไซต์ · Delete site" aria-label="ลบไซต์ ${esc(nm)}">${ic('x')}</button>`:''}</div>`}).join('')}</div><button class="tab-add" type="button" data-act="addSite" title="เพิ่มไซต์ · Add site" aria-label="เพิ่มไซต์ Add site">${ic('plus')}</button>`;
  ed.setAttribute('aria-labelledby','tab-'+S.cur);
}

/* statusOf / sumOf: completeness dot and the one-line summary for a nav key. */
function statusOf(key){const s=site();
  if(key==='doc')return lvl([S.doc.title,S.doc.company].filter(filled).length,2);
  if(key==='site')return filled(s.name)?'full':'empty';
  if(key.startsWith('sec:')){const sec=SECTIONS.find(x=>x.id===key.slice(4));return sec?sec.done(s):'empty'}
  const r=s.racks[+key.slice(5)];return r?rackStat(r):'empty'}
function sumOf(key){const s=site();
  if(key==='doc')return 'ใช้ร่วมกันทุกไซต์';
  if(key==='site')return `${S.sites.length} ไซต์ในเอกสาร`;
  if(key.startsWith('sec:')){const sec=SECTIONS.find(x=>x.id===key.slice(4));return sec?sec.sum(s):''}
  const r=s.racks[+key.slice(5)];if(!r)return '';
  const used=unitsOf(r),free=Math.max(0,r.size-used),errs=Object.keys(devErrors(r)).length;
  return `<span class="name">${esc(r.rack||'Rack')}</span><span class="sumline">${r.device?`<span class="d">·</span><span class="mono">${esc(r.device)}</span>`:''}<span class="d">·</span><span><span class="mono">${used}U</span> ใช้</span><span class="d">·</span><span><span class="mono">${free}U</span> ว่าง</span>${errs?`<span class="d">·</span><span class="badge err" style="margin:0">${ic('warn','sm')}<span class="sr">คำเตือน </span>${errs}</span>`:''}</span>`}

function card(key,k,def,id,num,label,en,body){
  return `<details class="sec" id="${id}" data-k="${k}" data-nav="${key}" data-def="${def?1:0}"${isOpen(k,def)?' open':''}><summary>${ic('chev','chev')}<span class="t"><span class="num">${num}</span>${label}<small>${en}</small></span><span class="sum" data-sum="${key}">${sumOf(key)}</span>${dotI(statusOf(key),` data-dot="${key}"`)}</summary><div class="sec-b">${body}</div></details>`}

function devRow(r,d,di,RP,E){const m=E[di],eid='de-'+d.id,u=`aria-describedby="${eid}"${m?' aria-invalid="true"':''}`;
  return `<tr class="dev${m?' err':''}" data-di="${di}"><td><input type="text" class="mono" data-b="${RP}.devices.${di}.name" value="${esc(d.name)}" aria-label="ชื่ออุปกรณ์ แถว ${di+1}" placeholder="เช่น NetScaler MPX9200"></td>
    <td class="u"><input type="number" class="mono" inputmode="numeric" min="1" max="${r.size}" data-b="${RP}.devices.${di}.u" value="${esc(d.u)}" aria-label="U แถว ${di+1}" ${u}></td>
    <td class="h"><input type="number" class="mono" inputmode="numeric" min="1" max="${r.size}" data-b="${RP}.devices.${di}.h" value="${esc(d.h)}" aria-label="ความสูง U แถว ${di+1}" ${u}></td>
    <td class="a act"><button class="btn icon sm del ib" type="button" data-confirm="dDel" data-i="${RP.split('.').pop()}" data-j="${di}" aria-label="ลบอุปกรณ์ แถว ${di+1}" title="ลบอุปกรณ์ · Delete device">${ic('trash')}</button></td></tr>
    <tr class="errmsg"${m?'':' hidden'}><td colspan="4" id="${eid}">${m?ic('warn','sm')+esc(m):''}</td></tr>`}
/* syncDevErr(ri): update the inline overlap/out-of-range errors in place while typing, so focus stays in the field. */
function syncDevErr(ri){const r=site().racks[ri],box=document.getElementById(`ed-${S.cur}-racks-rack-${ri}`);if(!r||!box)return;const E=devErrors(r);
  box.querySelectorAll('tr.dev').forEach(tr=>{const m=E[+tr.dataset.di],er=tr.nextElementSibling;tr.classList.toggle('err',!!m);

/* ---------- active section: scroll-spy on the form, and the preview follows ---------- */
const cssPx=n=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n))||0;
const stickH=()=>cssPx('--bar-h')+cssPx('--seg-h')+cssPx('--chips-h');
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function pvScrollTo(id,smooth){const t=document.getElementById(id),sc=document.getElementById('pvScroll');if(!t||!sc||!sc.offsetParent)return;
  const behavior=smooth&&!reduceMotion()?'smooth':'auto';
  if(getComputedStyle(sc).overflowY!=='visible')sc.scrollTo({top:Math.max(0,t.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop-12),behavior});
  else window.scrollTo({top:Math.max(0,t.getBoundingClientRect().top+window.scrollY-stickH()-8),behavior})}
function followPreview(key){const id=pvId(key);pvScrollTo(document.getElementById(id)?id:`pv-${S.cur}`,true)}
function markActive(){
  document.querySelectorAll('#rail [aria-current],#chips [aria-current]').forEach(e=>e.removeAttribute('aria-current'));
  document.querySelectorAll(`#rail [data-nav="${ACTIVE}"],#chips [data-nav="${ACTIVE}"]`).forEach(e=>e.setAttribute('aria-current','true'));
  const ck=ACTIVE.startsWith('rack:')?'sec:racks':ACTIVE,chip=document.querySelector(`#chips [data-nav="${ck}"]`);
  if(chip){chip.setAttribute('aria-current','true');if(chip.offsetParent)chip.scrollIntoView({block:'nearest',inline:'nearest'})}}
function setActive(key,follow){const changed=key!==ACTIVE;ACTIVE=key;markActive();if(follow&&changed)followPreview(key)}
function goto(key){const e=document.getElementById(edId(key));if(!e)return;
  for(let d=e;d;d=d.parentElement&&d.parentElement.closest('details'))d.open=true;
  e.scrollIntoView({block:'start'});const sm=e.querySelector(':scope>summary');if(sm)sm.focus({preventScroll:true});
  ACTIVE=key;markActive();followPreview(key)}
/* Scroll-spy: an IntersectionObserver watches a 2px line just below the sticky bars; the deepest card crossing it (a rack inside the
   racks card) is the active one. The preview only follows once the user has scrolled, not on page load. */
let io,navEls=[],spy=false;const vis=new Set();
addEventListener('scroll',()=>{spy=true},{passive:true,once:true});
function observeNav(){
  if(io)io.disconnect();vis.clear();navEls=[...ed.querySelectorAll('[data-nav]')];
  if(typeof IntersectionObserver==='undefined')return;
  const line=Math.round(stickH())+70;
  io=new IntersectionObserver(es=>{es.forEach(e=>{const k=e.target.dataset.nav;if(e.isIntersecting)vis.add(k);else vis.delete(k)});
    let best=null;navEls.forEach(e=>{if(vis.has(e.dataset.nav))best=e.dataset.nav});if(best&&best!==ACTIVE)setActive(best,spy)},
    {rootMargin:`-${line}px 0px -${Math.max(0,innerHeight-line-2)}px 0px`});
  navEls.forEach(e=>io.observe(e))}
function setView(v){document.body.dataset.mv=v;document.querySelectorAll('#seg [data-mv]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mv===v)));
  requestAnimationFrame(()=>{if(v==='preview')pvScrollTo(document.getElementById(pvId(ACTIVE))?pvId(ACTIVE):`pv-${S.cur}`,false);
    else{const e=document.getElementById(edId(ACTIVE));if(e)e.scrollIntoView({block:'start'})}})}
/* The sticky offsets come from the measured bar/switch/chips heights, never from hard-coded pixels. */
function measure(){const h=id=>{const e=document.getElementById(id);return e&&getComputedStyle(e).display!=='none'?Math.round(e.getBoundingClientRect().height):0};
  const st=document.documentElement.style;st.setProperty('--bar-h',h('bar')+'px');st.setProperty('--seg-h',h('seg')+'px');st.setProperty('--chips-h',h('chips')+'px')}

/* ---------- copy for Word: rasterise SVGs, put rich HTML on clipboard ---------- */
function svgToPng(svgEl){return new Promise(res=>{
  const xml=new XMLSerializer().serializeToString(svgEl);const vb=svgEl.viewBox.baseVal;const sc=2;
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=vb.width*sc;c.height=vb.height*sc;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    res({src:c.toDataURL('image/png'),w:vb.width,h:vb.height})};img.onerror=()=>res(null);
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)})}
async function copyWord(){
  const src=document.getElementById('doc').cloneNode(true);
  const live=[...document.querySelectorAll('#doc svg')],clones=[...src.querySelectorAll('svg')];
  for(let i=0;i<live.length;i++){const p=await svgToPng(live[i]);if(p){const im=document.createElement('img');im.src=p.src;im.width=p.w;im.height=p.h;clones[i].replaceWith(im)}}
  src.querySelectorAll('.page').forEach((pg,i)=>{pg.style.cssText='font-family:Leelawadee UI,Tahoma,sans-serif;font-size:11pt;'+(i?'page-break-before:always;':'');});
  src.querySelectorAll('table').forEach(t=>{t.setAttribute('border','1');t.style.cssText='border-collapse:collapse;width:100%;'});
  src.querySelectorAll('td').forEach(td=>{td.style.cssText+='border:1px solid #3A3A3A;padding:3px 7px;vertical-align:top;'});
  src.querySelectorAll('h1,h2').forEach(h=>h.style.color='#1A5E80');
  const html=`<html><body>${src.innerHTML}</body></html>`;
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([toMarkdown()],{type:'text/plain'})})]);toast('Copied — paste into Word with Ctrl+V')}
  catch(e){const box=document.createElement('div');box.contentEditable='true';box.style.cssText='position:fixed;left:-9999px;top:0;background:#fff;color:#000';box.innerHTML=src.innerHTML;document.body.appendChild(box);
    const r=document.createRange();r.selectNodeContents(box);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}
    sel.removeAllRanges();box.remove();toast(ok?'Copied — paste into Word with Ctrl+V':'Copy was blocked here. Select the preview and press Ctrl+C.')}
}

/* ---------- toast (one live region for everything), modal, delete confirmation, export menu ---------- */
let tuT;
function toastHost(){let h=document.getElementById('toastUndo');
  if(!h){h=document.createElement('div');h.id='toastUndo';h.className='toast-host';h.setAttribute('aria-live','polite');h.setAttribute('aria-atomic','true');document.body.appendChild(h)}return h}

/* toastUndo(msg): announces msg with an Undo button for 6 s; call it right after a destructive act(). Hover/focus pauses the timer. */
function toastUndo(msg){const h=toastHost();clearTimeout(tuT);
  h.innerHTML=`<div class="toast">${ic('trash','t-ic')}<span></span><span class="sepd">·</span><button class="tbtn" type="button">Undo</button><button class="tbtn close" type="button" aria-label="ปิด Dismiss" title="ปิด · Dismiss">${ic('x')}</button></div>`;
  h.querySelector('span').textContent=msg;
  const bs=h.querySelectorAll('button'),end=()=>{h.innerHTML=''},run=()=>{clearTimeout(tuT);tuT=setTimeout(end,6000)};
  bs[0].onclick=()=>{end();undo()};bs[1].onclick=end;
  const t=h.firstChild;t.onmouseenter=()=>clearTimeout(tuT);t.onmouseleave=run;t.onfocusin=()=>clearTimeout(tuT);t.onfocusout=run;run()}

/* armDelete(btn, run): first click arms (red, "คลิกอีกครั้งเพื่อลบ", announced); a second click on the same button runs it.
   Esc, clicking elsewhere, losing focus or 3 s cancel. Icon-only buttons (.ib) show the label as a popover so rows never reflow. */
let armed=null;
function live(t){const l=document.getElementById('armLive');l.textContent='';setTimeout(()=>{l.textContent=t},30)}
function disarm(){if(!armed)return;const {el,t,html,ib}=armed;clearTimeout(t);armed=null;if(!el.isConnected)return;
  el.classList.remove('arm');if(ib)el.removeAttribute('data-arm');else{el.innerHTML=html;el.style.minWidth=''}live('')}
function armDelete(btn,run){
  if(armed&&armed.el===btn){disarm();run();return}
  disarm();const label='คลิกอีกครั้งเพื่อลบ',ib=btn.classList.contains('ib');
  armed={el:btn,html:btn.innerHTML,ib,t:setTimeout(disarm,3000)};btn.classList.add('arm');
  if(ib)btn.setAttribute('data-arm',label);else{btn.style.minWidth=Math.max(btn.offsetWidth,150)+'px';btn.textContent=label}
  live(label+' '+(btn.getAttribute('aria-label')||btn.title||''))}
document.addEventListener('pointerdown',e=>{if(armed&&!armed.el.contains(e.target))disarm()},true);
document.addEventListener('focusout',e=>{if(armed&&e.target===armed.el)disarm()});

function closeMenu(ret){expMenu.hidden=true;expBtn.setAttribute('aria-expanded','false');if(ret)expBtn.focus()}
expBtn.addEventListener('click',e=>{expMenu.hidden?openMenu(e.detail===0):closeMenu(false)});
expBtn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();openMenu(true)}});
expMenu.addEventListener('click',()=>closeMenu(false));
expMenu.addEventListener('keydown',e=>{const it=menuItems(),i=it.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();it[(i+1)%it.length].focus()}
  else if(e.key==='ArrowUp'){e.preventDefault();it[(i-1+it.length)%it.length].focus()}
  else if(e.key==='Home'){e.preventDefault();it[0].focus()}else if(e.key==='End'){e.preventDefault();it[it.length-1].focus()}
  else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeMenu(true)}else if(e.key==='Tab')closeMenu(false)});

document.addEventListener('keydown',e=>{
  const root=$('modalRoot');
  if(root.firstChild){
    if(e.key==='Escape'){e.preventDefault();closeModal();return}
    if(e.key==='Tab'){const f=[...root.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea,select,a[href]')].filter(x=>x.offsetParent!==null);
      if(!f.length)return;const first=f[0],last=f[f.length-1],a=document.activeElement;
      if(!root.contains(a)){e.preventDefault();first.focus()}else if(e.shiftKey&&a===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&a===last){e.preventDefault();first.focus()}}
    return}
  if(e.key==='Escape'&&armed)disarm()});

/* liveRefresh(path): after typing, refresh the preview and the derived chrome (summaries, dots, rail, inline errors) without rebuilding the form. */
function liveRefresh(path){
  renderDoc();
  if(/^sites\.\d+\.name$/.test(path))renderTabs();
  if(/\.floor\./.test(path))refreshFloor();
  const m=/^sites\.\d+\.racks\.(\d+)\./.exec(path);if(m)syncDevErr(+m[1]);
  updateChrome()}
function refreshFloor(){const f=document.getElementById('floorEd');if(!f)return;const a=document.activeElement,k=a&&a.dataset&&a.dataset.tog;
  f.innerHTML=floorSVG(site().floor,true);if(k){const n=f.querySelector(`[data-tog="${k}"]`);if(n)n.focus({preventScroll:true})}}
function toggleRack(el){const [i,j]=el.dataset.tog.split(':').map(Number);const rk=site().floor.items[i].racks[j];
  if(rk.n){mutate(()=>{rk.on=!rk.on});save();refreshFloor();renderDoc();updateChrome()}}
ed.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.b){let v=t.value;if(t.type==='number')v=v===''?'':Math.max(1,parseInt(v,10)||1);beginEdit();setP(S,t.dataset.b,v);save();
    clearTimeout(liveT);liveT=setTimeout(()=>liveRefresh(t.dataset.b),150)}
  if(t.dataset.frow!=null){beginEdit();const it=site().floor.items[+t.dataset.frow];const old=it.racks;const names=t.value.split(',').map(x=>x.trim());
    it.racks=names.map((n,k)=>({n,on:!!(old.find(o=>o.n&&o.n===n)||{}).on}));save();

});

  if(t.dataset.img){const f=t.files[0];if(!f)return;const kind=t.dataset.img,sd=site();shrink(f,kind==='logo'?400:1600).then(putImg).then(ref=>{

function shrink(file,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.88))};im.src=r.result};r.readAsDataURL(file)})}

const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};

const DEL_MSG={delSite:'ลบไซต์แล้ว',rDel:'ลบตู้ Rack แล้ว',dDel:'ลบอุปกรณ์แล้ว',pDel:'ลบแหล่งจ่ายแล้ว',cDel:'ลบประเภทสายแล้ว',fDel:'ลบรายการในแผนผังแล้ว'};

/* Site tabs: roving tabindex, arrow keys / Home / End, × arms a delete. */
const tabsEl=document.getElementById('tabs');
tabsEl.addEventListener('click',e=>{

  if(e.key==='ArrowRight')i=(i+1)%n;else if(e.key==='ArrowLeft')i=(i-1+n)%n;else if(e.key==='Home')i=0;else if(e.key==='End')i=n-1;else return;
  e.preventDefault();selectSite(i);const nt=document.getElementById('tab-'+i);if(nt)nt.focus()});
function selectSite(i){if(i===S.cur)return;S.cur=i;save();renderAll();window.scrollTo(0,0);ACTIVE='site';markActive();pvScrollTo(`pv-${i}`,false)}
function delTab(i){mutate(()=>{S.sites.splice(i,1);if(S.cur>i||S.cur>=S.sites.length)S.cur=Math.max(0,S.cur-1)});save();renderAll();toastUndo('ลบไซต์แล้ว')}

/* act(): one undo step per action; returns false when nothing happened. onAct() adds the UI follow-up (focus / scroll). */
function act(a,i,j){if(mutate(()=>doAct(a,i,j))===false)return false;save();renderAll();return true}
function onAct(a,i,j){
  if(!act(a,i,j))return;
  if(a==='addSite'||a==='dupSite'){window.scrollTo(0,0);ACTIVE='site';markActive();pvScrollTo(`pv-${S.cur}`,false)}
  else if(a==='rAdd')goto('rack:'+(site().racks.length-1));
  else if(a==='dAdd'){const r=site().racks[i],f=document.querySelector(`[data-b="sites.${S.cur}.racks.${i}.devices.${r.devices.length-1}.name"]`);if(f)f.focus()}}

/* Startup wiring for the chrome: view switch default, measured sticky offsets, undo/redo buttons (top bar and phone bottom bar). */
let lastStick='';
function measureAndWatch(){measure();const k=stickH()+'x'+innerHeight;if(k!==lastStick){lastStick=k;observeNav()}}
function initChrome(){document.body.dataset.mv='edit';
  ['bUndo','mUndo'].forEach(i=>{$(i).onclick=()=>undo()});['bRedo','mRedo'].forEach(i=>{$(i).onclick=()=>redo()});
  if(typeof ResizeObserver!=='undefined'){const ro=new ResizeObserver(measureAndWatch);['bar','seg','chips'].forEach(id=>ro.observe($(id)))}
  addEventListener('resize',measureAndWatch);measure()}
function doAct(a,i,j){const s=site(),fl=s.floor.items;
  switch(a){
    case 'addSite':S.sites.push(blankSite(S.sites.length+1));S.cur=S.sites.length-1;break;
    case 'dupSite':S.sites.splice(S.cur+1,0,cloneSite(s));S.cur++;toast('ทำสำเนาไซต์แล้ว — เปลี่ยนชื่อและแก้ไขตู้ Rack');break;
    case 'delSite':if(S.sites.length===1){toast('เอกสารต้องมีอย่างน้อย 1 ไซต์');return false}S.sites.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);break;
    case 'moveL':if(S.cur>0){mv(S.sites,S.cur,-1);S.cur--}break;
    case 'moveR':if(S.cur<S.sites.length-1){mv(S.sites,S.cur,1);S.cur++}break;
    case 'rmLogo':S.doc.logo='';break;
    case 'apjcLogo':S.doc.logo=null;break;
    case 'rmDiag':s.diagram.img=null;break;
    case 'fUp':mv(fl,i,-1);break; case 'fDn':mv(fl,i,1);break; case 'fDel':fl.splice(i,1);break;
    case 'fAddRow':fl.push({id:uid(),type:'row',racks:[R('A1'),R('A2'),R('A3')]});break;
    case 'fAddLbl':fl.push({id:uid(),type:'label',text:'Front'});break;
    case 'rAdd':{const nr=blankRack();s.racks.push(nr);setOpen('rack:'+nr.id,true);break}   // UI state, not undoable: the new rack opens
    case 'rDup':{const c=JSON.parse(JSON.stringify(s.racks[i]));c.id=uid();setOpen('rack:'+c.id,true);s.racks.splice(i+1,0,c);break}
    case 'rDel':s.racks.splice(i,1);break;
    case 'rUp':mv(s.racks,i,-1);break; case 'rDn':mv(s.racks,i,1);break;
    case 'dAdd':{const r=s.racks[i],used=new Set();r.devices.forEach(d=>{const u=+d.u,h=+d.h||1;if(u)for(let k=u;k<u+h;k++)used.add(k)});
      let u=r.devices.reduce((m,d)=>Math.max(m,(+d.u||0)+(+d.h||1)),0)||21;   // just above the highest device, as before
      if(u>r.size||used.has(u)){u=0;for(let k=1;k<=r.size&&!u;k++)if(!used.has(k))u=k;u=u||r.size}   // else the first free U
      r.devices.push({id:uid(),name:'',u,h:1});break}
    case 'dDel':s.racks[i].devices.splice(j,1);break;
    case 'pAdd':s.racks[i].power.push('มีเพียงพอต่อการใช้งาน C12-C13');break;
    case 'pDel':s.racks[i].power.splice(j,1);break;
    case 'cAdd':s.racks[i].cables.push({id:uid(),type:'สาย ',text:''});break;
    case 'cDel':s.racks[i].cables.splice(j,1);break;
    default:return false;
  }
}
document.addEventListener('keydown',e=>{  // app undo/redo; text fields keep their native undo
  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;const k=e.key.toLowerCase();if(k!=='z'&&k!=='y')return;
  const t=e.target;if(t&&(t.isContentEditable||t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!/^(button|checkbox|radio|file|submit|reset|range|color)$/.test(t.type))))return;
  if(document.getElementById('modalRoot').firstChild)return;
  e.preventDefault();if(k==='y'||e.shiftKey)redo();else undo()});
/* ---------- save helper: claude downloads capability when hosted, plain link when offline ---------- */
async function saveFile(name,data,mime){
  if(window.claude&&window.claude.use){
    try{const d=await window.claude.use('downloads');
      if(d){try{await d.save({filename:name,data});toast('Saved '+name)}catch(e){if(e&&e.code!=='declined')toast('Could not save: '+(e.message||e.code))}return}}catch(_){}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- minimal ZIP writer (stored, no compression) ---------- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipFiles(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  files.forEach(f=>{const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);
    c.setUint32(42,off,true);central.push(new Uint8Array(c.buffer),name);
    off+=30+name.length+data.length});
  const cdSize=central.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* ---------- images ---------- */
function dataUrlBytes(u){const [h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return {bytes:a,ext:/image\/png/.test(h)?'png':'jpeg'}}
function imgSize(u){return new Promise(r=>{const i=new Image();i.onload=()=>r({w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>r({w:400,h:300});i.src=u})}
function svgStrToPng(str,scale=2){return new Promise(res=>{
  const m=str.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);const w=+m[1],h=+m[2];
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);res({url:c.toDataURL('image/png'),w,h})};
  img.onerror=()=>res(null);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str)})}

/* ---------- Word (.docx) builder ---------- */
async function buildDocx(){
  const FONT='Leelawadee UI',TEAL='1A5E80',W=9638; // A4, 2 cm margins → usable width in twips
  const media=[];let pid=1;
  const addMedia=(u)=>{const {bytes,ext}=dataUrlBytes(u);const n=media.length+1;const m={file:`image${n}.${ext}`,bytes,ext,rid:'rIdImg'+n};media.push(m);return m};
  const pic=(rid,wpx,hpx,maxPx)=>{const k=Math.min(1,maxPx/wpx);const cx=Math.round(wpx*k*9525),cy=Math.round(hpx*k*9525);const id=pid++;
    return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Picture ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="img${id}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`};
  const rpr=o=>`<w:rPr>${o.b?'<w:b/><w:bCs/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}${o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:''}</w:rPr>`;
  const run=(t,o={})=>String(t??'').split('\n').map(l=>`<w:r>${rpr(o)}<w:t xml:space="preserve">${esc(l)}</w:t></w:r>`).join('<w:r><w:br/></w:r>');
  const para=(inner,o={})=>`<w:p><w:pPr>${o.style?`<w:pStyle w:val="${o.style}"/>`:''}${o.pb?'<w:pageBreakBefore/>':''}${o.keep?'<w:keepNext/>':''}${o.border?`<w:pBdr><w:top w:val="single" w:sz="12" w:space="8" w:color="${TEAL}"/><w:bottom w:val="single" w:sz="12" w:space="8" w:color="${TEAL}"/></w:pBdr>`:''}${o.tabs?`<w:tabs><w:tab w:val="right" w:leader="dot" w:pos="${W}"/></w:tabs>`:''}<w:spacing w:before="${o.before||0}" w:after="${o.after??80}"/>${o.ind?`<w:ind w:left="${o.ind}"/>`:''}${o.align?`<w:jc w:val="${o.align}"/>`:''}</w:pPr>${inner}</w:p>`;
  const K=3500,V=W-K;
  const cell=(inner,o={})=>`<w:tc><w:tcPr><w:tcW w:w="${o.w||(o.span?W:V)}" w:type="dxa"/>${o.span?'<w:gridSpan w:val="2"/>':''}</w:tcPr>${inner||'<w:p/>'}</w:tc>`;
  const cp=(inner,o={})=>`<w:p><w:pPr><w:spacing w:before="20" w:after="20"/>${o.align?`<w:jc w:val="${o.align}"/>`:''}</w:pPr>${inner}</w:p>`;
  const tr=cells=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${cells}</w:tr>`;
  const kvr=(k,v)=>tr(cell(cp(run(k)),{w:K})+cell(cp(run(v))));
  const span=(inner,align)=>tr(cell(cp(inner,{align}),{span:1}));
  const tbl=rows=>`<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="3A3A3A"/>`).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="${K}"/><w:gridCol w:w="${V}"/></w:tblGrid>${rows.join('')}</w:tbl>${para('',{after:0})}`;

  let b='';
  // cover
  b+=para('',{before:3600})+para(run(S.doc.title,{sz:64,color:TEAL}),{border:1,before:0,after:300});
  b+=para(run(S.doc.company,{sz:26}),{after:400});
  b+=para(run('ขอบเขตการสำรวจ',{sz:18}),{after:40})+S.sites.map(s=>para(run('— '+s.name,{sz:18}),{after:20})).join('');
  // TOC: page numbers come from the same page plan as the preview
  b+=para(run('สารบัญ',{b:1,sz:26}),{pb:1,align:'center',after:200});
  let toc='';
  pagePlan().sites.forEach(p=>{
    toc+=para(run(p.s.name)+'<w:r><w:tab/></w:r>'+run(p.start),{tabs:1,after:40});
    p.secs.forEach((n,i)=>{toc+=para(run(`${i+1}.  ${SECTIONS[i].title}`,{b:1})+'<w:r><w:tab/></w:r>'+run(n),{tabs:1,ind:360,after:40})})});
  b+=toc;
  const c={run,para,tbl,kvr,span,pic,addMedia};
  for(let si=0;si<S.sites.length;si++){const s=S.sites[si];let open=true;
    b+=para(run(s.name,{sz:34,color:TEAL}),{style:'Heading1',pb:1,after:200});
    for(let k=0;k<SECTIONS.length;k++){const sec=SECTIONS[k],x=secX(sec,k,si);
      x.pb=!sec.page&&!open;open=!sec.page;   // a flow section after a page section starts a new page
      b+=await sec.docx(s,x,c)}
  }
  // header logo
  const L=logoSrc();let hdr='';
  if(L){const sz=await imgSize(L);const {bytes,ext}=dataUrlBytes(L);media.push({file:'logo.'+ext,bytes,ext,rid:'rIdLogo',header:1});
    const h=40,w=Math.round(sz.w*h/sz.h);hdr=para(pic('rIdLogo',w,h,w),{align:'right',after:0})}
  else hdr=para(run(S.doc.logoText||'',{b:1,color:TEAL,sz:28}),{align:'right',after:0});

  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const docXml=`${X}<w:document ${NS}><w:body>${b}<w:sectPr><w:headerReference w:type="default" r:id="rIdHdr"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const hdrXml=`${X}<w:hdr ${NS}>${hdr}</w:hdr>`;
  const styles=`${X}<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:eastAsia="${FONT}" w:cs="${FONT}"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="en-US" w:bidi="th-TH"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:outlineLvl w:val="0"/></w:pPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:outlineLvl w:val="1"/></w:pPr></w:style>
<w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:tblPr><w:tblCellMar><w:left w:w="108" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`;
  const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const docRels=`${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="${R}/styles" Target="styles.xml"/><Relationship Id="rIdHdr" Type="${R}/header" Target="header1.xml"/>${media.filter(m=>!m.header).map(m=>`<Relationship Id="${m.rid}" Type="${R}/image" Target="media/${m.file}"/>`).join('')}</Relationships>`;
  const hdrRels=`${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${media.filter(m=>m.header).map(m=>`<Relationship Id="${m.rid}" Type="${R}/image" Target="media/${m.file}"/>`).join('')}</Relationships>`;
  const ct=`${X}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`;
  const rootRels=`${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`;
  const core=`${X}<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${esc(S.doc.title)}</dc:title><dc:creator>Rack Site Survey Editor</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0,19)}Z</dcterms:created></cp:coreProperties>`;
  return zipFiles([{name:'[Content_Types].xml',data:ct},{name:'_rels/.rels',data:rootRels},{name:'docProps/core.xml',data:core},{name:'word/document.xml',data:docXml},
    {name:'word/styles.xml',data:styles},{name:'word/header1.xml',data:hdrXml},{name:'word/_rels/document.xml.rels',data:docRels},{name:'word/_rels/header1.xml.rels',data:hdrRels},
    ...media.map(m=>({name:'word/media/'+m.file,data:m.bytes}))]);
}
const fileBase=()=>(S.doc.title||'Site Survey').replace(/[\\/:*?"<>|]+/g,' ').trim()+' '+new Date().toISOString().slice(0,10);
async function exportDocx(){const bs=[...document.querySelectorAll('.js-docx')];bs.forEach(b=>{b.disabled=true;b.querySelector('.lbl').textContent='กำลังสร้าง…'});
  try{const blob=await buildDocx();await saveFile(fileBase()+'.docx',blob,blob.type)}catch(err){toast('สร้างไฟล์ Word ไม่สำเร็จ: '+err.message)}
  bs.forEach(b=>{b.disabled=false;b.querySelector('.lbl').textContent='ดาวน์โหลด .docx'})}
document.querySelectorAll('.js-docx').forEach(b=>{b.onclick=exportDocx});

/* ---------- start: load image cache before first render, move inline images to IndexedDB, then GC ---------- */
(async()=>{
  idbOpen();  // warm up: the first open can be slow on a fresh profile
  let loaded=false;const lp=loadImages(S).then(n=>{loaded=true;return n});
  await Promise.race([lp,new Promise(r=>setTimeout(r,2000))]);
  initChrome();renderAll();histUI();measureAndWatch();save();   // persist right away so a fresh sample (random ids) keeps its identity
  if(!loaded)lp.then(n=>{if(n)renderAll()});  // slow IndexedDB: render now, re-render when images arrive
  const before=snap();await internImages(S);if(snap()!==before)save();
  setTimeout(()=>gcImages().catch(()=>{}),3000);
})();
})();
